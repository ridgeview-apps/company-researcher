[project]
name = "company-researcher"
version = "0.1.0"
description = "Evidence-driven investigations over UK company filings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
company-researcher = "company_researcher.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m \"not real_corpus\""
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "real_corpus: needs the real, manually-ingested Gymshark/Nothing Technology corpus (not run in CI; see README's Quality checks section)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["company_researcher"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
# Several dependencies (e.g. pypdfium2) ship no py.typed marker and no type
# stubs. mypy already treats such imports as untyped/Any by default; without
# this, pyright instead infers types from their unannotated source (e.g.
# guessing `int` from a `scale=1` default whose real, documented type is
# `float`), producing false positives mypy never raises. Disabling this
# makes pyright fall back the same way mypy already does for genuinely
# untyped dependencies, rather than one checker guessing where the other
# abstains.
useLibraryCodeForTypes = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
